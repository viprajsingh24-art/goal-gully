function goal(s){score[s]++;upd();pause=120;place();roar();cel={t:120,s:s,n:lastK&&lastK.side===s?lastK.n:'',cf:Array.from({length:80},()=>({x:W/2,y:H/2,vx:(Math.random()-.5)*14,vy:-Math.random()*12-2,r:3+Math.random()*5,c:['#ff9f1c','#ff2e93','#ffffff','#7dff9b','#5ad1ff'][Math.floor(Math.random()*5)]}))};$('sc').style.color=s?'#ff6b6b':'#7dff9b';setTimeout(()=>$('sc').style.color='',900)}
function end(){state='over';const a=score[0],b=score[1];let r,sub='',btn='';
if(mode==='wc'){let adv=a>b;if(a===b){adv=Math.random()<.5+(me.str-op.str)/100;sub=`Penalties: ${adv?'you win':'you lose'}.`}
 if(adv&&round===2){r='World Champions!';sub+=' '+me.name+' lift the trophy.';btn='<button class="go" data-a="home">Main menu</button>'}
 else if(adv){r='Through!';btn=`<button class="go" data-a="next">Next: ${['','Semi-final','Final'][round+1]} vs ${wcOpps[round+1].name}</button>`}
 else{r='Knocked out';btn='<button class="go" data-a="wc">Try again</button><button data-a="home">Main menu</button>'}}
else{r=a>b?'You win!':a<b?'You lost':'Draw';btn='<button class="go" data-a="again">Play again</button><button data-a="club">Change club</button><button data-a="home">Main menu</button>'}
show(`<h1>${r}</h1><p>${me.name} ${a} - ${b} ${op.name}</p><p>${sub}</p><div class="row">${btn}</div>`)}
// ===== DRAWING =====
function figure(p,moving){
const d=p.fx>=0?1:-1,ph=moving?tick*.35:0,sw=Math.sin(ph)*4;
X.save();X.translate(p.x,p.y);
X.fillStyle='rgba(0,0,0,.28)';X.beginPath();X.ellipse(0,15,12,5,0,0,7);X.fill();
[-1,1].forEach(k=>{X.fillStyle=p.skin;X.fillRect(k*3-2,3,4,10);X.fillStyle=p.alt;X.fillRect(k*3-2,8,4,5);X.fillStyle='#111';X.fillRect(k*3-2+(k*sw*.5)*d,12,5,3)});
X.fillStyle=p.alt;X.fillRect(-7,-2,14,7);
X.fillStyle=p.col;X.beginPath();X.roundRect(-8,-14,16,14,3);X.fill();
X.fillStyle=p.skin;X.fillRect(-11,-13,3,9+sw*.3);X.fillRect(8,-13,3,9-sw*.3);
X.fillStyle=p.alt;X.font='700 8px sans-serif';X.textAlign='center';X.fillText(p.num,0,-5);
X.fillStyle=p.skin;X.beginPath();X.arc(0,-20,6,0,7);X.fill();
X.fillStyle=p.hair;
if(p.style===0){X.beginPath();X.arc(0,-21,6.3,Math.PI,0);X.fill()}
else if(p.style===1){X.beginPath();X.arc(0,-22,8,Math.PI*.9,Math.PI*2.1);X.fill()}
else{X.fillRect(-6,-22,12,2)}
X.fillStyle='#111';X.fillRect(d*2-1,-20,1.6,1.6);X.fillRect(d*4-1,-20,1.6,1.6);
X.restore()}
function draw(){
tick++;X.fillStyle='#2a7a3a';X.fillRect(0,0,W,H);
for(let i=0;i<10;i++){X.fillStyle=i%2?'#1f7a46':'#19693b';X.fillRect(i*100,0,100,H)}
const gl=X.createRadialGradient(W/2,H/2,100,W/2,H/2,620);gl.addColorStop(0,'rgba(255,255,255,.08)');gl.addColorStop(1,'rgba(14,6,45,.6)');X.fillStyle=gl;X.fillRect(0,0,W,H);
X.strokeStyle='rgba(255,255,255,.85)';X.lineWidth=3;X.strokeRect(3,3,W-6,H-6);
X.beginPath();X.moveTo(W/2,3);X.lineTo(W/2,H-3);X.stroke();X.beginPath();X.arc(W/2,H/2,70,0,7);X.stroke();
X.strokeRect(3,170,150,280);X.strokeRect(W-153,170,150,280);
X.fillStyle='#fff';X.fillRect(0,G1,6,G2-G1);X.fillRect(W-6,G1,6,G2-G1);
X.fillStyle='rgba(10,5,40,.75)';X.fillRect(0,0,W,11);X.fillRect(0,H-11,W,11);
const cheer=cel&&cel.t>0?4:1.2;for(let i=0;i<100;i++){const c=['#ff2e93','#ff9f1c','#ffffff','#5ad1ff','#b388ff'][i%5],bb=Math.sin(tick*.1+i*1.7)*cheer;X.fillStyle=c;X.fillRect(i*10+2,3+bb,5,5);X.fillRect(i*10+2,H-9-bb,5,5)}
[[0,0],[W,0],[0,H],[W,H]].forEach(q=>{const lg=X.createRadialGradient(q[0],q[1],0,q[0],q[1],200);lg.addColorStop(0,'rgba(255,240,170,.4)');lg.addColorStop(1,'rgba(255,240,170,0)');X.fillStyle=lg;X.fillRect(q[0]-200,q[1]-200,400,400)});
if(!P)return;
[...P].sort((a,b)=>a.y-b.y).forEach(p=>{
 if(p===ctrl){X.strokeStyle='#ffd23f';X.lineWidth=3;X.beginPath();X.ellipse(p.x,p.y+15,17,8,0,0,7);X.stroke()}
 figure(p,Math.hypot(p.vx,p.vy)>.5);
 if(p===ctrl){X.fillStyle='#fff';X.font='700 17px Barlow Condensed,sans-serif';X.textAlign='center';X.fillText(p.n,p.x,p.y-34);
 X.fillStyle='#222';X.fillRect(p.x-16,p.y+22,32,4);X.fillStyle='#ffd23f';X.fillRect(p.x-16,p.y+22,32*p.st/100,4)}});
X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(ball.x,ball.y+6,6,3,0,0,7);X.fill();
X.fillStyle='#fff';X.strokeStyle='#111';X.lineWidth=2;X.beginPath();X.arc(ball.x,ball.y,6,0,7);X.fill();X.stroke();
if(hold>0&&ctrl){X.fillStyle='#222';X.fillRect(ctrl.x-20,ctrl.y+30,40,5);X.fillStyle='#ff6b6b';X.fillRect(ctrl.x-20,ctrl.y+30,40*hold,5)}
if(pause>0&&state==='play'&&!(cel&&cel.t>0)){X.fillStyle='rgba(0,0,0,.4)';X.fillRect(0,H/2-34,W,68);X.fillStyle='#fff';X.font='700 38px Archivo Black,Impact,sans-serif';X.textAlign='center';X.fillText(time<1&&score[0]+score[1]===0?'KICK-OFF':'GET READY',W/2,H/2+14)}
if(cel&&cel.t>0){cel.t--;const k=1-cel.t/120;cel.cf.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=.35;X.fillStyle=f.c;X.fillRect(f.x,f.y,f.r,f.r*1.6)});
X.save();X.translate(W/2,H/2);const z=1+Math.sin(Math.min(1,k*3)*Math.PI)*.25;X.scale(z,z);X.textAlign='center';X.font='120px Archivo Black,Impact,sans-serif';X.lineWidth=10;X.strokeStyle='#120b2e';X.strokeText('GOAL!',0,0);X.fillStyle=cel.s?'#ff6b6b':'#ff9f1c';X.fillText('GOAL!',0,0);
if(cel.n){X.font='700 38px Barlow Condensed,sans-serif';X.fillStyle='#fff';X.strokeText(cel.n+' scores',0,52);X.lineWidth=6;X.fillText(cel.n+' scores',0,52)}X.restore()}
$('clock').textContent=Math.floor(time)+"'"}
function loop(){if(state==='play')step();draw();requestAnimationFrame(loop)}
home();loop();
// ===== INPUT =====
addEventListener('keydown',e=>{key[e.key.length===1?e.key.toLowerCase():e.key]=1;if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>{key[e.key.length===1?e.key.toLowerCase():e.key]=0});
const joy=$('joy'),nub=$('nub');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+70),dy=e.clientY-(r.top+70),d=Math.min(1,Math.hypot(dx,dy)/55),a=Math.atan2(dy,dx);
T.x=Math.cos(a)*d;T.y=Math.sin(a)*d;nub.style.transform='translate('+T.x*45+'px,'+T.y*45+'px)'}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;T.x=T.y=0;nub.style.transform=''};
const hb=(id,k,hold)=>{const b=$(id);b.onpointerdown=e=>{e.preventDefault();T[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{if(hold)T[k]=0}};
hb('bs','sh',1);hb('br','run',1);hb('bp','ps',0);
</script></body></html>
